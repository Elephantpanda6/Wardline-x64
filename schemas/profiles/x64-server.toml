# Wardline Profile: x86_64 Cloud / CI Server (Windows Server x64, Linux x64, FreeBSD amd64)
version = 1
name = "x64-cloud-server"

[architecture]
mode = "strict_native"

[execution]
isolation = "L1"
working_dir = "."
inherit_env = false
allowed_env = ["PATH", "SystemRoot", "HOME", "LANG"]
deny_scripts = true
deny_lolbins = true
timeout_ms = 60000
max_memory_mb = 2048
max_processes = 32
cpu_rate_percent = 80
acg = true
cet_shadow_stack = true

[filesystem]
workspace_read = ["."]
workspace_write = []
denied_prefixes = [
    "C:\\Windows\\System32\\config",
    "\\\\?\\",
    "\\\\",
    "/etc/shadow",
    "/etc/gshadow",
    "/etc/sudoers",
    "/root",
    "/var/run/docker.sock",
]

[network]
egress_mode = "proxy_only"
allow_ipv6 = false
allow_private_ips = false
allow_metadata_ips = false
allowed_destinations = [
    "https://api.github.com/**",
]

[credentials]
allowed_grants = []
max_bytes_per_request = 1048576

[approvals]
require_on_write = true
require_on_network_post = true
default_ttl_secs = 180

[audit]
log_path = ".wardline/audit.wlog"
lock_mode = "exclusive_blocking"
seal_interval_events = 32
