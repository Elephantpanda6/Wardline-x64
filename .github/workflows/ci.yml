name: Wardline Win-x64 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  win-x64:
    name: Windows x64 Suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Build and Test Zig x64 Engine
        shell: pwsh
        run: |
          zig build
          zig build test

      - name: Clippy Workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace -- --test-threads=1

      - name: Build Release Binaries
        run: cargo build --release --bins

      - name: Verify PE Architecture & Doctor Probe
        shell: pwsh
        run: |
          function Get-PeMachine($path) {
            $fs = [System.IO.File]::OpenRead((Resolve-Path $path))
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              $fs.Seek(0x3C, 'Begin') | Out-Null
              $peOff = $br.ReadInt32()
              $fs.Seek($peOff + 4, 'Begin') | Out-Null
              return $br.ReadUInt16()
            } finally {
              $fs.Dispose()
            }
          }
          foreach ($bin in @("wardline.exe", "wardline-guard.exe", "wardline-mcp.exe", "wardline-verify.exe")) {
            $m = Get-PeMachine "target\x86_64-pc-windows-msvc\release\$bin"
            if ($m -ne 0x8664) { throw "$bin x64 machine mismatch: 0x$($m.ToString('X4'))" }
          }
          .\target\x86_64-pc-windows-msvc\release\wardline.exe doctor --json
          .\target\x86_64-pc-windows-msvc\release\wardline-verify.exe --help
