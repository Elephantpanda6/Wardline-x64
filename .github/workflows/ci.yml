name: Wardline x64 Multi-OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  zig-engines-cross:
    name: Zig 4-OS x64 Engine Cross-Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Cross-compile Win/Linux/macOS/FreeBSD x64 engines
        run: |
          zig build all-engines
          zig build common-tests

  win-x64:
    name: Windows 11 x64 Native Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build & test Zig x64 engines
        shell: pwsh
        run: |
          zig build all-engines
          zig build test
      - name: Cargo clippy & full workspace tests
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace -- --test-threads=1
          cargo build --release --bins

  linux-x64:
    name: Linux x64 Native Build & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install OpenSSL headers & build/test workspace
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
          zig build linux-x64
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace -- --test-threads=1
          cargo build --release --bins

  macos-x64:
    name: macOS x64 Cross/Native Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build macOS x64 Zig engine & check workspace
        run: |
          zig build macos-x64
          cargo clippy --target x86_64-apple-darwin --workspace --all-targets -- -D warnings
