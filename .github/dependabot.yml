version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/clients/rust/wardline-client"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/clients/python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/clients/ts"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/clients/go/wardline"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
